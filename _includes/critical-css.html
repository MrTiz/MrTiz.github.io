<style>
/* Hand-maintained subset of _sass/{_tokens,_reset,_base,_layout,_components}.scss.
   If tokens, header markup or breakpoints change there, update here too. */

:root {
    --font-sans:
        "Inter",
        "Inter Fallback Segoe UI",
        "Inter Fallback Ubuntu",
        "Inter Fallback Roboto",
        "Inter Fallback DejaVu",
        "Inter Fallback Noto",
        "Inter Fallback Arial",
        ui-sans-serif, system-ui, -apple-system, Roboto,
        "Helvetica Neue", "Noto Sans", sans-serif,
        "Apple Color Emoji", "Segoe UI Emoji";
    --font-mono:
        "Cascadia Code",
        "Cascadia Code Fallback Cascadia Mono",
        "Cascadia Code Fallback SF Mono",
        "Cascadia Code Fallback Menlo",
        "Cascadia Code Fallback Consolas",
        "Cascadia Code Fallback Ubuntu",
        "Cascadia Code Fallback Roboto",
        "Cascadia Code Fallback DejaVu",
        "Cascadia Code Fallback Liberation",
        "Cascadia Code Fallback Noto",
        ui-monospace, "SF Mono", "SFMono-Regular",
        "Menlo", "Consolas", "Liberation Mono", monospace;

    --step--1: clamp(0.83rem, 0.80rem + 0.18vw, 0.92rem);
    --step-0:  clamp(0.96rem, 0.92rem + 0.22vw, 1.05rem);
    --step-3:  clamp(1.55rem, 1.35rem + 1.00vw, 1.95rem);
    --step-5:  clamp(2.20rem, 1.75rem + 2.30vw, 3.30rem);

    --lh-tight: 1.15;
    --lh-body:  1.7;

    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-4: 1rem;
    --space-7: 3rem;
    --space-9: 6rem;

    --container-pad: clamp(1rem, 3vw, 3rem);

    --ease:  cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-1: 120ms;
    --dur-2: 220ms;

    --radius-2: 8px;
}

:root,
:root[data-theme="dark"] {
    color-scheme: dark;

    --bg-0: hsl(220, 15%, 7%);
    --bg-1: hsl(220, 15%, 10%);
    --bg-2: hsl(220, 14%, 13%);

    --border-1: hsl(220, 12%, 20%);

    --fg-0: hsl(210, 20%, 97%);
    --fg-1: hsl(220, 15%, 88%);
    --fg-2: hsl(220, 10%, 68%);
    --fg-3: hsl(220, 8%, 50%);

    --accent:       hsl(190, 90%, 60%);
    --accent-hover: hsl(190, 95%, 72%);
    --accent-soft:  hsla(190, 60%, 20%, 0.6);

    --link: var(--accent);
}

:root[data-theme="light"] {
    color-scheme: light;

    --bg-0: hsl(0, 0%, 100%);
    --bg-1: hsl(220, 20%, 98.5%);
    --bg-2: hsl(220, 20%, 96%);

    --border-1: hsl(220, 15%, 88%);

    --fg-0: hsl(220, 25%, 10%);
    --fg-1: hsl(220, 20%, 22%);
    --fg-2: hsl(220, 12%, 42%);
    --fg-3: hsl(220, 8%, 58%);

    --accent:       hsl(195, 90%, 36%);
    --accent-hover: hsl(195, 95%, 28%);
    --accent-soft:  hsl(195, 80%, 90%);

    --link: var(--accent);
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

* {
    margin: 0;
}

html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overflow-x: clip;
    font-family: var(--font-sans);
    background: var(--bg-0);
    color: var(--fg-1);
}

body {
    min-height: 100dvh;
    line-height: var(--lh-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
    font-size: var(--step-0);
    display: flex;
    flex-direction: column;
    font-synthesis: none;
}

img,
svg {
    display: block;
    max-width: 100%;
    height: auto;
}

a {
    color: var(--link);
    text-decoration: none;
}

h1,
h2,
h3,
h4,
h5,
h6 {
    color: var(--fg-0);
    font-weight: 650;
    letter-spacing: -0.015em;
    line-height: var(--lh-tight);
}

h1 {
    font-size: var(--step-5);
    font-weight: 700;
    letter-spacing: -0.03em;
}

h2 {
    font-size: var(--step-3);
}

.container {
    width: 100%;
    max-width: 120rem;
    margin-inline: auto;
    padding-inline: var(--container-pad);
}

.site-main {
    flex: 1 0 auto;
    padding-block: var(--space-7) var(--space-9);
}

.site-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in oklch, var(--bg-0) 88%, transparent);
    backdrop-filter: saturate(160%) blur(12px);
    -webkit-backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid transparent;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.site-header__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    height: 4rem;
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    color: var(--fg-0);
    font-size: var(--step-0);
    letter-spacing: -0.01em;
    text-decoration: none;
}

.brand__mark {
    display: inline-flex;
    width: 1.75rem;
    height: 1.75rem;
    align-items: center;
    justify-content: center;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: var(--radius-2);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.85rem;
    border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
}

.brand__text {
    line-height: 1;
}

.site-nav {
    display: flex;
    align-items: center;
    gap: var(--space-2);
}

.site-nav__links {
    display: flex;
    gap: var(--space-1);
    list-style: none;
    padding: 0;
    margin: 0;
}

.site-nav__link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    height: 2.25rem;
    padding: 0 0.85rem;
    border-radius: var(--radius-2);
    color: var(--fg-2);
    font-size: var(--step--1);
    font-weight: 500;
    text-decoration: none;
    border: 1px solid transparent;
}

.site-nav__icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: var(--radius-2);
    color: var(--fg-2);
    border: 1px solid transparent;
    background: transparent;
}

.site-nav__icon {
    width: 0.95rem;
    height: 0.95rem;
    flex-shrink: 0;
    color: var(--fg-3);
}

@media (max-width: 720px) {
    .site-nav {
        gap: var(--space-1);
    }

    .site-nav__links {
        gap: 0.1rem;
    }

    .site-nav__link {
        padding: 0 0.5rem;
        gap: 0;
    }

    .site-nav__link span {
        display: none;
    }

    .site-nav__icon {
        width: 1.05rem;
        height: 1.05rem;
    }

    .site-nav__link .site-nav__icon {
        color: var(--fg-2);
    }

    .site-nav__link--rss {
        display: none;
    }
}

@media (max-width: 480px) {
    .brand__text {
        font-size: var(--step--1);
    }
}

@media (max-width: 380px) {
    .brand__text {
        display: none;
    }
}

.skip-link {
    position: absolute;
    top: -3rem;
    left: 1rem;
    background: var(--accent);
    color: var(--bg-0);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-2);
    z-index: 100;
    font-weight: 600;
}

.skip-link:focus {
    top: 0.75rem;
}
</style>
