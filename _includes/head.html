<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
{%- if page.noindex -%}
<meta name="robots" content="noindex, follow" />
{%- endif -%}
<!-- Dark default, updated by theme-toggle.js if the user picks light -->
<meta name="theme-color" content="#0f1218" id="theme-color-meta" />

<!-- Cross-fade page transitions in Chromium; no-op in other browsers -->
<meta name="view-transition" content="same-origin" />

{%- if site.google_site_verification -%}
<meta
    name="google-site-verification"
    content="{{ site.google_site_verification }}"
/>
{%- endif -%}

<!-- Inline theme boot: applies saved theme before first paint to avoid FOUC -->
<script>
    (function () {
        try {
            var q = new URLSearchParams(location.search).get("theme");
            if (q === "light" || q === "dark") {
                document.documentElement.setAttribute("data-theme", q);
                localStorage.setItem("theme", q);
                return;
            }
            var saved = localStorage.getItem("theme");
            document.documentElement.setAttribute(
                "data-theme",
                saved === "light" ? "light" : "dark",
            );
        } catch (_) {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    })();
</script>

<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any" />
<link rel="apple-touch-icon" href="{{ '/favicon.ico' | relative_url }}" />

<link
    rel="preload"
    href="{{ '/assets/fonts/InterVariable.woff2' | relative_url }}"
    as="font"
    type="font/woff2"
    crossorigin
    fetchpriority="high"
/>
<link
    rel="preload"
    href="{{ '/assets/fonts/cascadia-code.woff2' | relative_url }}"
    as="font"
    type="font/woff2"
    crossorigin
    fetchpriority="high"
/>

<style>
    html {
        font-family: sans-serif;
    }
    code,
    pre,
    kbd,
    samp,
    tt {
        font-family: monospace;
    }
</style>

<link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
/>

<link
    rel="alternate"
    type="application/atom+xml"
    title="{{ site.title }}"
    href="{{ '/feed.xml' | relative_url }}"
/>

<!-- Custom <title> without the "| site.title" suffix that seo-tag would add -->
{%- if page.url == "/" or page.title == nil -%}
<title>{{ site.title | escape }}</title>
{%- else -%}
<title>{{ page.title | escape }}</title>
{%- endif -%} {%- seo title=false -%}

<!-- Extra OG image metadata: seo-tag emits only og:image when image: is a string. All OG assets are 1200x630 PNG -->
{%- if page.image or site.image -%}
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:alt" content="{{ page.title | default: site.title | escape }}" />
<meta name="twitter:image:alt" content="{{ page.title | default: site.title | escape }}" />
{%- endif -%}
